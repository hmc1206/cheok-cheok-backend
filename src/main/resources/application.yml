spring:
  application:
    name: cheok-cheok-backend
  profiles:
    default: local
  jpa:
    open-in-view: false
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - openid
              - profile
              - email

app:
  auth:
    jwt-secret: ${JWT_SECRET}
    access-token-ttl: ${ACCESS_TOKEN_TTL:30m}
    refresh-token-ttl: ${REFRESH_TOKEN_TTL:14d}
    frontend-callback-url: ${FRONTEND_CALLBACK_URL:http://localhost:5173/auth/callback}
    secure-cookie: ${SECURE_COOKIE:true}

server:
  port: ${SERVER_PORT:8080}
